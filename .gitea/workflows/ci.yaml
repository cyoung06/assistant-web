name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: registry.syeyoung.dev/assistant/assistant-web

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24.22.0-alpine
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      - name: Typecheck and build
        run: npm run build

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.syeyoung.dev
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Tag
        id: tag
        # <run number>-<short sha>: Flux picks the highest run number.
        run: echo "tag=${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
